<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber City Sim - Light Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #313131;
            color: #fff;
            overflow: hidden;
            line-height: 1.6;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 20, 40, 0.85);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 8px;
            padding: 15px;
            z-index: 100;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 150, 255, 0.3);
        }
        
        .control-btn {
            background: rgba(0, 40, 80, 0.8);
            border: 1px solid rgba(0, 150, 255, 0.5);
            color: #8af;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }
        
        .control-btn:hover {
            background: rgba(0, 80, 160, 0.8);
            color: #0ff;
        }
        
        #fpsCounter {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 6px;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 1rem;
            color: #0f0;
            z-index: 100;
        }
        
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 150, 255, 0.3);
            border-top: 4px solid #0cf;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 200, 255, 0.5);
            border-radius: 6px;
            padding: 10px 15px;
            font-family: monospace;
            font-size: 0.9rem;
            color: #0ff;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="container">        
        <div id="controls">
            <button class="control-btn" id="dayNight">Day/Night</button>
            <button class="control-btn" id="particleToggle">Particles: ON</button>
            <button class="control-btn" id="toggleFog">Fog: ON</button>
            <button class="control-btn" id="lowQuality">Quality: High</button>
        </div>
        
        <div id="fpsCounter">FPS: --</div>
        <div id="info">Buildings: 100</div>
        
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Light City Sim...</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                document.getElementById('loading').style.display = 'none';
                init();
            }, 500);
        });

        function init() {
            // Scene setup - simplified
            const scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x000010, 10, 200);
            
            // Camera setup
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 500);
            camera.position.set(30, 20, 30);
            
            // Renderer setup - reduced quality for performance
            const renderer = new THREE.WebGLRenderer({ 
                antialias: false, // Disable antialiasing for performance
                powerPreference: "low-power"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1)); // Limit pixel ratio
            renderer.shadowMap.enabled = false; // Disable shadows for performance
            document.getElementById('container').appendChild(renderer.domElement);
            
            // Performance monitoring
            let frameCount = 0;
            let lastTime = performance.now();
            let fps = 60;
            
            // REDUCED City parameters
            const citySize = 65;
            const buildingCount = 120; 
            const particleCount = 1000; 
            
            // Simplified lighting
            const ambientLight = new THREE.AmbientLight(0x444444);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(30, 50, 30);
            scene.add(directionalLight);
            
            // Simplified ground
            const groundGeometry = new THREE.PlaneGeometry(citySize * 2, citySize * 2);
            const groundMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x111122
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            scene.add(ground);
            
            // Simplified road grid - fewer roads
            const roadMaterial = new THREE.LineBasicMaterial({ color: 0x333344 });
            for (let i = -citySize; i <= citySize; i += 20) { // Increased spacing
                // Vertical roads
                const verticalGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(i, 0.1, -citySize),
                    new THREE.Vector3(i, 0.1, citySize)
                ]);
                const verticalRoad = new THREE.Line(verticalGeometry, roadMaterial);
                scene.add(verticalRoad);
                
                // Horizontal roads
                const horizontalGeometry = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-citySize, 0.1, i),
                    new THREE.Vector3(citySize, 0.1, i)
                ]);
                const horizontalRoad = new THREE.Line(horizontalGeometry, roadMaterial);
                scene.add(horizontalRoad);
            }
            
            // Simplified buildings - no instanced rendering for compatibility
            const buildingTypes = [
                { width: 4, depth: 4, minHeight: 8, maxHeight: 25 },
                { width: 5, depth: 5, minHeight: 15, maxHeight: 40 },
            ];
            
            const buildings = [];
            
            // Generate buildings
            for (let i = 0; i < buildingCount; i++) {
                const type = buildingTypes[Math.floor(Math.random() * buildingTypes.length)];
                const x = Math.floor(Math.random() * citySize * 2) - citySize;
                const z = Math.floor(Math.random() * citySize * 2) - citySize;
                
                // Avoid center
                if (Math.abs(x) < 15 && Math.abs(z) < 15) continue;
                
                const height = type.minHeight + Math.random() * (type.maxHeight - type.minHeight);
                const width = type.width;
                const depth = type.depth;
                
                // Simple box building
                const geometry = new THREE.BoxGeometry(width, height, depth);
                const material = new THREE.MeshBasicMaterial({ 
                    color: Math.random() * 0x444444 + 0x222222
                });
                
                const building = new THREE.Mesh(geometry, material);
                building.position.set(x, height/2, z);
                buildings.push(building);
                scene.add(building);
            }
            
            // Very simple particle system
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = particleCount;
            const posArray = new Float32Array(particlesCount * 3);
            
            for (let i = 0; i < particlesCount * 3; i += 3) {
                posArray[i] = (Math.random() - 0.5) * citySize * 2; 
                posArray[i + 1] = Math.random() * 50; 
                posArray[i + 2] = (Math.random() - 0.5) * citySize * 2;
            }
            
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            
            // Simple particle material
            const particlesMaterial = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.5,
                transparent: true,
                opacity: 0.6
            });
            
            const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
            scene.add(particleSystem);
            
            // Control buttons functionality
            let isDay = false;
            let particlesEnabled = true;
            let fogEnabled = true;
            let highQuality = true;
            
            document.getElementById('dayNight').addEventListener('click', function() {
                isDay = !isDay;
                if (isDay) {
                    scene.fog.color.setHex(0x88aadd);
                    ambientLight.intensity = 0.6;
                    directionalLight.intensity = 1.0;
                } else {
                    scene.fog.color.setHex(0x000010);
                    ambientLight.intensity = 0.3;
                    directionalLight.intensity = 0.3;
                }
            });
            
            document.getElementById('particleToggle').addEventListener('click', function() {
                particlesEnabled = !particlesEnabled;
                particleSystem.visible = particlesEnabled;
                this.textContent = particlesEnabled ? 'Particles: ON' : 'Particles: OFF';
            });
            
            document.getElementById('toggleFog').addEventListener('click', function() {
                fogEnabled = !fogEnabled;
                scene.fog.near = fogEnabled ? 10 : 1000;
                scene.fog.far = fogEnabled ? 200 : 1000;
                this.textContent = fogEnabled ? 'Fog: ON' : 'Fog: OFF';
            });
            
            document.getElementById('lowQuality').addEventListener('click', function() {
                highQuality = !highQuality;
                if (highQuality) {
                    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
                    this.textContent = 'Quality: High';
                } else {
                    renderer.setPixelRatio(1);
                    this.textContent = 'Quality: Low';
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // Simple camera rotation
            let cameraAngle = 0;
            
            // Animation loop
            function animate() {
                requestAnimationFrame(animate);
                
                // Update FPS counter
                frameCount++;
                const currentTime = performance.now();
                if (currentTime >= lastTime + 1000) {
                    fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    document.getElementById('fpsCounter').textContent = `FPS: ${fps}`;
                    frameCount = 0;
                    lastTime = currentTime;
                }
                
                // Simple camera rotation
                cameraAngle += 0.002;
                camera.position.x = Math.cos(cameraAngle) * 40;
                camera.position.z = Math.sin(cameraAngle) * 40;
                camera.lookAt(scene.position);
                
                // Simple particle animation
                if (particlesEnabled) {
                    const positions = particleSystem.geometry.attributes.position.array;
                    for (let i = 1; i < positions.length; i += 3) {
                        positions[i] -= 0.05;
                        if (positions[i] < 0) {
                            positions[i] = 50;
                        }
                    }
                    particleSystem.geometry.attributes.position.needsUpdate = true;
                }
                
                // Render scene
                renderer.render(scene, camera);
            }
            
            // Start animation
            animate();
        }
    </script>
</body>
</html>
